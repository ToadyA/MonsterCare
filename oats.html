<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oatkylosaurus</title>
    <link rel="stylesheet" href="oats.css">

</head>
<body>
    <div class="stat" id="age">
        Age: 0
    </div>
    <div class="bar">
        <div id="hunger">
            <h3>Hunger</h3>
        </div>
        <div id="energy">
            <h3>Energy</h3>
        </div>
        <div id="happy">
            <h3>Happiness</h3>
        </div>
        <div id="sleep">
            <h3>Sleepiness</h3>
        </div>
        <div id="bored">
            <h3>Boredom</h3>
        </div>
    </div>
    <div class="bgBar">
        <div id="bar1"></div>
        <div id="bar2"></div>
        <div id="bar3"></div>
        <div id="bar4"></div>
        <div id="bar5"></div>
    </div>
    <div class="stat" id="cash">
        <img src="images/icon/Wage.png">
        <h3>Cash: $</h3>
    </div>

    <div id="Oatkylosaurus">
        <img src="images/dino/Egg.png" height="150px" width="150px">
    </div>

    <div class="UI">
        <div id="Bag">
            <img src="images/icon/DuffelBag.png">
            <h3>Stuff</h3>
            <p>Stuff</p>
        </div>
        <div id="Food">
            <img src="images/icon/MiniOats.png">
            <h3>Mealtime!</h3>
            <p>Mealtime!</p> 
        </div>
        <div id="playBall">
            <img src="images/icon/Ball.png">
            <h3>Playtime!</h3>
            <p>Playtime!</p>
        </div>
        <div id="Books">
            <img src="images/icon/Reading.png">
            <h3>Storytime!</h3>
            <p>Storytime!</p>
        </div>
        <div id="startShift">
            <img src="images/icon/PunchCard.png">
            <h3>Work...</h3>
            <p>Work...</p>
        </div>
    </div>

    <div class="work">
        <div id="shiftBG"></div>
        <div id="station"></div>
        <div id="RolledBin">
            <img src="images/work/RolledBin.png" height="200px" width="200px">
        </div>
        <div id="QuickBin">
            <img src="images/work/QuickBin.png" height="200px" width="200px">
        </div>
        <!-- https://freesound.org/people/Benboncan/sounds/103632/ -->
        <div id="hammer">
            <img src="images/work/HammerUp.png">
        </div>
        <div id="oat">
            <img src="images/work/RollOat.png">
        </div> 
        <div id="debris">
            <img src="images/work/SteelOat.png">
        </div>
    </div>

    <!-- https://freesound.org/people/burnsie289/sounds/152416/ -->
    <div id="dodgeball">
        <img src="images/BigRedBall.png" width="100px" height="100px" style="display: block; z-index: 15; position: absolute; left: 50%; top: 30%;">
    </div>
    <img src="images/oatForeground.png" style="position:absolute;z-index:1;left:-5px;top:-5px;width:1925px;height:916px;pointer-events:none;">

    <script src="oats.js"></script>
</body>
</html>
